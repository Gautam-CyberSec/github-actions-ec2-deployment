name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build job needs to push to GHCR; everything else is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: ${{ github.repository }}

jobs:
  lint:
    name: actionlint · shellcheck · hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Workflows are the product here, so they get linted like source.
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck · shfmt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x deploy/*.sh tests/*.sh
          curl -sSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt -i 4 -ci -d deploy/*.sh tests/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: nginx configuration is valid
        run: |
          sudo apt-get install -y -qq nginx
          sudo cp deploy/nginx/app.conf /etc/nginx/conf.d/app.conf
          sudo cp deploy/nginx/upstream.conf.initial /etc/nginx/conf.d/upstream.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/test_deploy_lib.sh

  unit-bash3:
    name: unit tests (bash 3.2)
    runs-on: macos-latest
    # macOS still ships bash 3.2. Established in Linux-Server-Hardening: this is
    # what stops bash-4-only syntax reaching contributors who cannot run it.
    steps:
      - uses: actions/checkout@v7
      - run: bash --version | head -1
      - run: bash tests/test_deploy_lib.sh

  build:
    name: build · push · scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag1: ${{ steps.tags.outputs.tag1 }}
      tag2: ${{ steps.tags.outputs.tag2 }}
      tag3: ${{ steps.tags.outputs.tag3 }}
    steps:
      - uses: actions/checkout@v7

      - id: tags
        name: Derive immutable tags
        # Three distinct builds, so the deployment test can prove a deploy
        # actually replaced the running version rather than merely restarting it.
        run: |
          short="$(git rev-parse --short HEAD)"
          {
            echo "tag1=sha-${short}-1"
            echo "tag2=sha-${short}-2"
            echo "tag3=sha-${short}-3"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN rather than a personal token: scoped to this repository,
      # rotated per run, and never stored anywhere.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push three builds
        run: |
          repo="ghcr.io/$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"
          for t in "${{ steps.tags.outputs.tag1 }}" "${{ steps.tags.outputs.tag2 }}" "${{ steps.tags.outputs.tag3 }}"; do
            docker build --build-arg "APP_VERSION=${t}" -t "${repo}:${t}" .
            docker push "${repo}:${t}"
            echo "pushed ${repo}:${t}"
          done

      - name: Assert the image does not run as root
        run: |
          repo="ghcr.io/$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"
          user="$(docker image inspect "${repo}:${{ steps.tags.outputs.tag1 }}" --format '{{.Config.User}}')"
          echo "configured user: ${user:-<root>}"
          test "$user" = "1000:1000"

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.tag1 }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  deploy-e2e:
    name: end-to-end deployment
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # The runner stands in for the EC2 instance: real sshd, real Docker, real
      # nginx. deploy.sh cannot tell the difference, so the production path is
      # exercised without an AWS account. EC2-specific concerns — instance
      # profiles, security groups, IMDS — are NOT covered here; SECURITY.md says so.
      - name: Prepare the runner as an SSH deployment target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssh-server
          ssh-keygen -t ed25519 -N '' -f /tmp/deploy_key -C ci-e2e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat /tmp/deploy_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          # Host key verification is exercised rather than skipped.
          ssh-keyscan -H 127.0.0.1 > /tmp/known_hosts 2>/dev/null
          # Passwordless sudo for nginx reload, matching what bootstrap.sh grants.
          echo "$(id -un) ALL=(ALL) NOPASSWD: /usr/sbin/nginx, /bin/mv" | sudo tee /etc/sudoers.d/deploy >/dev/null

      - name: Install the nginx proxy
        run: |
          sudo cp deploy/nginx/app.conf /etc/nginx/conf.d/app.conf
          sudo cp deploy/nginx/upstream.conf.initial /etc/nginx/conf.d/upstream.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the real deploy script end to end
        env:
          E2E_KEY: /tmp/deploy_key
          E2E_KNOWN_HOSTS: /tmp/known_hosts
          E2E_TAG_1: ${{ needs.build.outputs.tag1 }}
          E2E_TAG_2: ${{ needs.build.outputs.tag2 }}
          E2E_TAG_3: ${{ needs.build.outputs.tag3 }}
          NGINX_UPSTREAM_PATH: /etc/nginx/conf.d/upstream.conf
        run: |
          IMAGE_REPO="$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')" \
            bash tests/e2e.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          cat /etc/nginx/conf.d/upstream.conf || true
          docker logs deploy-payload-blue 2>&1 | tail -30 || true
          docker logs deploy-payload-green 2>&1 | tail -30 || true

  docs:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments
            README.md ARCHITECTURE.md LESSONS.md SECURITY.md CONTRIBUTING.md ROADMAP.md
          fail: true

      - name: Reject github.com blob URLs in image tags
        run: |
          if grep -rnE '(src="|\]\()https://github\.com/[^)"]*/blob/' \
               --include='*.md' --exclude-dir=node_modules .; then
            echo "::error::blob URLs serve text/html, not the image. Use a relative path."
            exit 1
          fi
          echo "no blob-style image URLs found"
