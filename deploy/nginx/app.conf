# Reverse proxy in front of whichever colour is live.
#
# The upstream itself lives in a separate file that deploy.sh rewrites, so a
# deployment never edits this one — it only replaces the upstream and reloads.

server {
    listen 80 default_server;
    server_name _;

    # Identifies the proxy rather than the application, so a version reported
    # through it is genuinely the container's own.
    add_header X-Served-By "nginx" always;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A deploy stops the old container shortly after the switch. Short
        # timeouts plus one retry mean a request that lands mid-switch is
        # retried against the new colour instead of failing.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
